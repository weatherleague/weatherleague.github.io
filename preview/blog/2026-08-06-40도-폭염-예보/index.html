<!--

  GitHub Pages에는 서버측 301 전달 기능이 없어 이런 껍데기 페이지가 유일한 방법이다.

  ⚠ 이 파일은 반드시 site/public/ 아래에 둔다 — 저장소 루트(배포본)에만 두면
     다음 빌드 결과를 루트로 복사할 때 사라진다. public/은 빌드마다 그대로 복사된다.
  ⚠ 앞으로 발행한 글의 주소는 바꾸지 않는다 (머리말 slug 고정). 이 파일은 주소 체계를
     정하기 전에 하루 나가 있던 첫 글에 대한 일회성 처리다.
-->
